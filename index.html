<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laboratory Asset Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="container">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <h2>Laboratory Asset Management System</h2>

    <!-- Dashboard Metrics -->
    <div class="dashboard">
      <div class="card"><h3>Total Requests</h3><p id="cnt-total">0</p></div>
      <div class="card"><h3>Pending</h3><p id="cnt-pending">0</p></div>
      <div class="card"><h3>Approved</h3><p id="cnt-approved">0</p></div>
      <div class="card"><h3>Released</h3><p id="cnt-released">0</p></div>
    </div>

    <!-- Request Form -->
    <form id="requestForm" onsubmit="saveRequest(event)">
      <input type="hidden" id="req-id">
      <input type="text" id="requester_name" placeholder="Requester Name" required>
      <input type="text" id="department" placeholder="Department" required>
      <select id="category" required>
        <option value="">-- Select Equipment --</option>
        <option value="Laptop">Laptop</option>
        <option value="Projector">Projector</option>
        <option value="Oscilloscope">Oscilloscope</option>
        <option value="Microscope">Microscope</option>
      </select>
      <select id="priority" required>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="Approved" class="admin-only">Approved</option>
        <option value="Rejected" class="admin-only">Rejected</option>
        <option value="Released" class="admin-only">Released</option>
        <option value="Returned">Returned</option>
        <option value="Overdue">Overdue</option>
        <option value="Closed">Closed</option>
      </select>
      <textarea id="description" placeholder="Purpose of borrowing / description" required></textarea>
      <button type="submit" id="btn-save">Submit Request</button>
    </form>

    <!-- Search & Filter Controls -->
    <div class="filters">
      <input type="text" id="search" placeholder="Search Requester or Description" oninput="loadRequests()">
      <select id="filter-status" onchange="loadRequests()">
        <option value="All">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
        <option value="Released">Released</option>
        <option value="Returned">Returned</option>
        <option value="Overdue">Overdue</option>
        <option value="Closed">Closed</option>
      </select>
      <select id="filter-priority" onchange="loadRequests()">
        <option value="All">All Priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
    </div>

    <!-- Data Table -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Requester</th>
          <th>Dept</th>
          <th>Equipment</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="requests-table"></tbody>
    </table>
  </div>
</body>
</html>
